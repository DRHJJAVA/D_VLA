   <g id="text_1">
    <text style="font-size: 27px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #193349" x="57.6" y="59.849156" transform="rotate(-0 57.6 59.849156)">05  三维视觉编码：从双视角图像到逐点特征</text>
   </g>
   <g id="text_2">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #586875" x="57.6" y="101.655" transform="rotate(-0 57.6 101.655)">B：批量；T＝16：历史长度；N＝2048：每帧点预算。以下先展示一个时刻。</text>
   </g>
   <g id="text_3">
    <text style="font-size: 19px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #193349" x="374.4" y="182.057406" transform="rotate(-0 374.4 182.057406)">双视角 RGB</text>
   </g>
   <g id="text_4">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #243c4d" x="374.4" y="201.527" transform="rotate(-0 374.4 201.527)">[B, 2, 3, H, W]</text>
   </g>
   <g id="text_5">
    <text style="font-size: 19px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #193349" x="1072.8" y="182.057406" transform="rotate(-0 1072.8 182.057406)">深度、相机标定、候选掩码</text>
   </g>
   <g id="text_6">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #243c4d" x="1072.8" y="201.527" transform="rotate(-0 1072.8 201.527)">SAM2.1 只提供分组；无效观测用 mask</text>
   </g>
   <g id="text_7">
    <text style="font-size: 19px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #193349" x="374.4" y="339.377406" transform="rotate(-0 374.4 339.377406)">冻结空间视觉编码器</text>
   </g>
   <g id="text_8">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(246.32 375.65125)">原版：SmolVLM2 视觉网格，768 维</text>
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(238.1275 399.49875)">DINOv3-S+ 对照：patch 网格，384 维</text>
   </g>
   <g id="text_9">
    <text style="font-size: 19px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #193349" x="1072.8" y="339.377406" transform="rotate(-0 1072.8 339.377406)">真实三维点与特征对齐</text>
   </g>
   <g id="text_10">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(938.1825 375.886875)">像素 → 真实 XYZ → 双视角可见性融合</text>
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(933.91375 399.183125)">Linear(Cv,128) → LayerNorm → GELU</text>
   </g>
   <g id="text_11">
    <text style="font-size: 19px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #193349" x="720" y="551.417406" transform="rotate(-0 720 551.417406)">保留坐标，学习逐点描述符</text>
   </g>
   <g id="text_12">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(628.17 575.91925)">XYZ [B,N,3]；f0 [B,N,128]</text>
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(592 598.68675)">归一化形状坐标与米制坐标分开保存</text>
   </g>
   <g id="text_13">
    <text style="font-size: 19px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #193349" x="374.4" y="736.097406" transform="rotate(-0 374.4 736.097406)">PointNet++ · 局部下采样 SA1</text>
   </g>
   <g id="text_14">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(273.9425 772.74375)">2048 → 512 点；候选内近邻</text>
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(214.46125 795.51125)">MLP 131 → 128 → 128 → 256；max pooling</text>
   </g>
   <g id="text_15">
    <text style="font-size: 19px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #193349" x="1072.8" y="736.097406" transform="rotate(-0 1072.8 736.097406)">PointNet++ · 局部下采样 SA2</text>
   </g>
   <g id="text_16">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(976.7825 772.74375)">512 → 128 点；候选内近邻</text>
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(912.86125 795.51125)">MLP 259 → 256 → 256 → 512；max pooling</text>
   </g>
   <g id="text_17">
    <text style="font-size: 19px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #193349" x="374.4" y="954.977406" transform="rotate(-0 374.4 954.977406)">特征传播 FP1</text>
   </g>
   <g id="text_18">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(261.525 991.79125)">回到 2048 点；拼接 f0 的 128 维</text>
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(270.40625 1014.55875)">MLP (256+128) → 256 → 256</text>
   </g>
   <g id="text_19">
    <text style="font-size: 19px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #193349" x="1072.8" y="954.977406" transform="rotate(-0 1072.8 954.977406)">特征传播 FP2</text>
   </g>
   <g id="text_20">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(949.33375 991.79125)">插值回 512 点；拼接 SA1 的 256 维</text>
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #243c4d" transform="translate(968.80625 1014.55875)">MLP (512+256) → 256 → 256</text>
   </g>
   <g id="text_21">
    <text style="font-size: 19px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #193349" x="720" y="1180.697406" transform="rotate(-0 720 1180.697406)">逐点三维特征 F</text>
   </g>
   <g id="text_22">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #243c4d" x="720" y="1208.51875" transform="rotate(-0 720 1208.51875)">[B,N,256] → 后续评分网络</text>
   </g>
   <g id="text_23">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #5d6d79" transform="translate(57.6 1309.155906)">SA / FP：下采样 / 特征传播。蓝线是跳接数据；近邻数量只组织局部几何，不判定接触。</text>
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP', 'DejaVu Sans', sans-serif; fill: #5d6d79" transform="translate(57.6 1329.225125)">768 / 384 维来自不同冻结骨干；两组统一投影到 128 维后使用同一后续网络。</text>
   </g>
  </g>
 </g>
